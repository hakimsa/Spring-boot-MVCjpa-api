apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-mvc-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-mvc-api
  template:
    metadata:
      labels:
        app: spring-mvc-api
    spec:
      containers:
      - name: spring-mvc-api
        image: hakimsamouh/mgtapp:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_URL
          value: jdbc:postgresql://192.168.0.19:5432/em_db
        - name: DB_USER
          value: hakim
        - name: DB_PASSWORD
          value: zoro123