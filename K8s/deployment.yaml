apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-mvc-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-mvc-api
  template:
    metadata:
      labels:
        app: spring-mvc-api
    spec:
      containers:
      - name: spring-mvc-api
        image: hakimsamouh/mgtapp:latest
        ports:
        - containerPort: 8087
        env:
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_URL
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD