apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spring-mvc-api
  namespace: default          # ← namespace de Prometheus, no de tu app
  labels:
    release: monitoring       # ← label que busca el operador
spec:
  namespaceSelector:
    matchNames:
      - development     # ← namespace de tu app, no de Prometheus
  selector:
    matchLabels:
      app: spring-mvc-api
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s