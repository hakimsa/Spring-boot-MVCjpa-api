name: Java CI with Maven + Docker

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ hakim ]

jobs:

  # ----------------------------
  # 1️⃣ BUILD & TEST
  # ----------------------------
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test with Maven
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ secrets.DB_NAME }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: mvn clean package


  # ----------------------------
  # 2️⃣ DOCKER BUILD & PUSH
  # ----------------------------
  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push'   # evita push en PR

    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          TAG=$(echo $GITHUB_SHA | cut -c1-7)
          VERSION="1.0.3"  # Opcional: extrae desde pubspec.yaml

          if [ "${GITHUB_REF##*/}" == "main" ]; then
            IMAGE_TAG=prod-$VERSION-$TAG
          else
            IMAGE_TAG=develop-$VERSION-$TAG
          fi

          echo "Building Docker image: hakimsamouh/api-server:$IMAGE_TAG"
          docker build -t hakimsamouh/api-server:$IMAGE_TAG .
          docker push hakimsamouh/api-server:$IMAGE_TAG

  # ----------------------------
  # 3️⃣ UPDATE MANIFEST (GitOps)
  # ----------------------------
  update-manifest:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'   # solo deploy en main

    steps:
      - uses: actions/checkout@v3

      - name: Update image tag
        run: |
          sed -i "s|tag:.*|tag: \"${{ github.sha }}\"|g" k8s/values.yaml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/values.yaml
          git commit -m "Update image tag to ${{ github.sha }}"
          git push

          