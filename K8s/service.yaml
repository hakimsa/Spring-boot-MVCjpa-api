apiVersion: v1

kind: Service
metadata:
  name: spring-mvc-api
  labels:
    app: spring-mvc-api
spec:
  selector:
    app: spring-mvc-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics                #coincidir con ServiceMonitor
      port: 8087
      targetPort: 8087